name: Compila APK Galleria

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip
        run: |
          unzip -o Galleria.zip -d sorgente
          DIR=$(dirname "$(find sorgente -name settings.gradle | head -n 1)")
          echo "APPDIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila
        run: cd "$APPDIR" && gradle assembleDebug --no-daemon --stacktrace

      - name: Prepara APK
        run: cp "$APPDIR/app/build/outputs/apk/debug/app-debug.apk" Galleria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Galleria-APK
          path: Galleria.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: galleria-${{ github.run_number }}
          name: Galleria ${{ github.run_number }}
          files: Galleria.apk
