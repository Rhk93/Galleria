name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip
        run: |
          ZIP=$(find . -path ./.git -prune -o -iname '*.zip' -print | head -n 1)
          if [ -z "$ZIP" ]; then echo "Nessun file .zip trovato nella repository"; exit 1; fi
          echo "Trovato: $ZIP"
          unzip -o -q "$ZIP" -d progetto
          SET=$(find progetto -name 'settings.gradle*' -not -path '*/build/*' | head -n 1)
          if [ -z "$SET" ]; then echo "settings.gradle non trovato nello zip"; exit 1; fi
          echo "APPDIR=$(dirname "$SET")" >> $GITHUB_ENV
          NOME=$(basename "$ZIP" | sed 's/\.[zZ][iI][pP]$//; s/[^A-Za-z0-9_-]/_/g')
          echo "NOME=$NOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila
        run: |
          cd "$APPDIR"
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Prepara APK
        run: |
          APK=$(find "$APPDIR" -name '*.apk' -path '*outputs/apk*' | head -n 1)
          cp "$APK" "$NOME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}-APK
          path: ${{ env.NOME }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOME }}-${{ github.run_number }}
          name: ${{ env.NOME }} ${{ github.run_number }}
          files: ${{ env.NOME }}.apk
